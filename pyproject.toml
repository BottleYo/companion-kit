[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-companion-kit"
version = "0.4.0"
description = "宿主无关的虚拟陪伴人格核心与 Codex 固定人物图片闭环"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Companion Kit contributors" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "skills/virtual-companion/scripts" }

[tool.setuptools.packages.find]
where = ["skills/virtual-companion/scripts"]
include = ["companion_kit*"]

[tool.setuptools.package-data]
companion_kit = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
